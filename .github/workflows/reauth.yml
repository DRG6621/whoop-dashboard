name: Reauth WHOOP Token

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reauth.yml'

permissions:
  contents: write

jobs:
  reauth:
    runs-on: ubuntu-latest
    env:
      WHOOP_CLIENT_ID:     ${{ secrets.WHOOP_CLIENT_ID }}
      WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
      AUTH_CODE:           ${{ secrets.WHOOP_AUTH_CODE }}
    steps:
      - uses: actions/checkout@v4

      - name: Exchange code and save encrypted refresh token
        run: |
          RESPONSE=$(curl -s -X POST "https://api.prod.whoop.com/oauth/oauth2/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=authorization_code" \
            --data-urlencode "code=${AUTH_CODE}" \
            --data-urlencode "client_id=${WHOOP_CLIENT_ID}" \
            --data-urlencode "client_secret=${WHOOP_CLIENT_SECRET}" \
            --data-urlencode "redirect_uri=http://localhost:8080/callback")

          ERROR=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('error',''))" 2>/dev/null)
          if [ -n "$ERROR" ]; then
            echo "ERROR: $RESPONSE"
            exit 1
          fi

          NEW_REFRESH=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['refresh_token'])")
          if [ -z "$NEW_REFRESH" ]; then
            echo "ERROR: no refresh_token in response"
            exit 1
          fi

          echo "$NEW_REFRESH" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass pass:"$WHOOP_CLIENT_SECRET" -base64 -A > .whoop_token
          echo "Token exchanged and encrypted OK"

      - name: Commit encrypted token
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .whoop_token
          git commit -m "Store encrypted WHOOP refresh token"
          git push
