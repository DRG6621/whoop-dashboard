name: Update Combined Dashboard

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC = 6:00 AM Eastern
  workflow_dispatch:

permissions:
  contents: write
  secrets: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      WHOOP_CLIENT_ID:      ${{ secrets.WHOOP_CLIENT_ID }}
      WHOOP_CLIENT_SECRET:  ${{ secrets.WHOOP_CLIENT_SECRET }}
      WHOOP_REFRESH_TOKEN:  ${{ secrets.WHOOP_REFRESH_TOKEN }}
      STRAVA_CLIENT_ID:     ${{ secrets.STRAVA_CLIENT_ID }}
      STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
      STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
      DAYS_BACK: "30"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Build combined dashboard
        run: python combined_fetch.py

      - name: Rotate WHOOP refresh token
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/new_whoop_token ]; then
            gh secret set WHOOP_REFRESH_TOKEN --repo ${{ github.repository }} --body "$(cat /tmp/new_whoop_token)"
            echo "â WHOOP refresh token rotated"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update dashboard $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
