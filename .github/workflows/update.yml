name: Update WHOOP Dashboard

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch WHOOP data & build dashboard
        env:
          WHOOP_CLIENT_ID:      ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET:  ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_REFRESH_TOKEN:  ${{ secrets.WHOOP_REFRESH_TOKEN }}
          WHOOP_DAYS_BACK:      "400"
        run: python whoop_fetch.py

      - name: Commit updated dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: update dashboard $(date -u '+%Y-%m-%d')"
          git push
